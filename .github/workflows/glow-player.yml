name: Glow Player APK

on:
  push:
    paths:
      - "glow-player/**"
      - ".github/workflows/glow-player.yml"
  pull_request:
    paths:
      - "glow-player/**"
      - ".github/workflows/glow-player.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glow-player
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: glow-player-debug-apk
          path: glow-player/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
